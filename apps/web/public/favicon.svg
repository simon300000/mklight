<svg xmlns="http://www.w3.org/2000/svg" viewBox="196 196 632 632">
  <!-- The app icon (apps/macos/Resources/AppIcon.svg) without its tile: the
       three elements on the beam, with fuller glass so they read on light and
       dark tab bars alike. -->
  <style>
    .beam { stroke: #F2A93B; }
    .edge { stroke: #343E71; }
    .blue { fill: #61B7DB; }
    .violet { fill: #8F8FE0; }
    @media (prefers-color-scheme: dark) {
      .beam { stroke: #FFE9BB; }
      .edge { stroke: #E3FBFF; }
      .blue { fill: #8DE1F3; }
      .violet { fill: #B4B1F9; }
    }
  </style>
  <defs>
    <ellipse id="element" rx="87" ry="197" stroke-width="22"/>
  </defs>
  <path class="beam" d="M218 659L807 364" stroke-width="40" stroke-linecap="round"/>
  <use href="#element" class="blue edge" transform="translate(361 588) rotate(-26.565)"/>
  <use href="#element" class="violet edge" transform="translate(510 513) rotate(-26.565)"/>
  <use href="#element" class="blue edge" transform="translate(659 438) rotate(-26.565)"/>
</svg>
