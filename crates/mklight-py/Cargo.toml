[package]
name = "mklight-py"
description = "MKLight Python bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Built as the extension module `mklight._mklight` by maturin (see
# pyproject.toml and docs/PYTHON.md). maturin sets
# `PYO3_BUILD_EXTENSION_MODULE`, which stops pyo3 linking libpython; plain
# `cargo build` / `cargo test` link libpython so the Rust tests run.
[lib]
name = "mklight"
crate-type = ["cdylib", "rlib"]

[dependencies]
mklight-core.workspace = true
mklight-engine.workspace = true
mklight-trace.workspace = true
serde.workspace = true
serde_json.workspace = true
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }

[dev-dependencies]
approx.workspace = true
