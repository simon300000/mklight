[package]
name = "mklight-ffi"
description = "MKLight C ABI for native applications"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
# One test program for `tests/` (`tests/main.rs`), not one per file.
autotests = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
mklight-core.workspace = true
mklight-engine.workspace = true
serde.workspace = true
serde_json.workspace = true

[[test]]
name = "tests"
path = "tests/main.rs"

# Its own program: it sets a process-wide environment variable.
[[test]]
name = "gpu_preparation"
path = "tests/gpu_preparation.rs"
