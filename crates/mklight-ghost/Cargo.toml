[package]
name = "mklight-ghost"
description = "MKLight explicit ghost-path tracing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
# One test program for `tests/` (`tests/main.rs`), not one per file.
autotests = false

[dependencies]
mklight-gpu.workspace = true
bytemuck.workspace = true
blake3.workspace = true
mklight-core.workspace = true
mklight-trace.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
libc = "0.2"

[target.'cfg(target_os = "macos")'.dev-dependencies]
mklight-metal.workspace = true

[[test]]
name = "tests"
path = "tests/main.rs"
