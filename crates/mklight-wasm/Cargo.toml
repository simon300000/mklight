[package]
name = "mklight-wasm"
description = "MKLight engine for the web: the wasm-bindgen API the engine worker calls (docs/WEB.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Everything is wasm32-only: natively the crate is empty, so the workspace
# builds and tests as before.
[target.'cfg(target_arch = "wasm32")'.dependencies]
mklight-core.workspace = true
mklight-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
