[package]
name = "mklight-wasm"
description = "MKLight engine for the web: the wasm-bindgen API the engine worker calls (docs/WEB.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["fft-simd", "webgpu"]
# The WebGPU backend (`gpu:webgpu`, docs/GPU.md §11): the GPU worker's entry
# point `gpu_thread` and `register_webgpu`.
webgpu = ["dep:mklight-webgpu", "dep:wasm-bindgen-futures"]
# rustfft's WebAssembly SIMD algorithms (needs the `simd128` target feature;
# scripts/build-wasm.sh --no-simd / --no-fft-simd turn it off).
fft-simd = ["dep:rustfft", "rustfft/wasm_simd"]

[lib]
crate-type = ["cdylib", "rlib"]

# Everything is wasm32-only: natively the crate is empty, so the workspace
# builds and tests as before.
[target.'cfg(target_arch = "wasm32")'.dependencies]
mklight-core.workspace = true
mklight-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
mklight-webgpu = { workspace = true, optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
# Only to enable its `wasm_simd` feature for mklight-wave (`fft-simd`).
rustfft = { workspace = true, optional = true }
