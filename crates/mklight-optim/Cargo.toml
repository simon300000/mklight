[package]
name = "mklight-optim"
description = "MKLight merit functions, optimizers and tolerancing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Optical evaluation is plugged in through `merit::OperandEvaluator`; the
# reference tracer backs `merit::trace_eval`, any `mklight-gpu` compute
# backend `merit::gpu_eval`.
[dependencies]
mklight-core.workspace = true
mklight-trace.workspace = true
mklight-gpu.workspace = true
mklight-analysis.workspace = true
mklight-wave.workspace = true
mklight-ghost.workspace = true
mklight-stray.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
bytemuck.workspace = true
blake3.workspace = true

[dev-dependencies]
approx.workspace = true
# GPU-vs-CPU evaluator tests and the throughput benchmark on a real device
# (an empty shell without Metal; the tests then skip).
mklight-metal.workspace = true
