[package]
name = "mklight-cuda"
description = "MKLight CUDA compute backend (NVIDIA; driver and NVRTC loaded at run time)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[dependencies]
mklight-core.workspace = true
mklight-gpu.workspace = true
mklight-webgpu.workspace = true
bytemuck.workspace = true
blake3.workspace = true
rayon.workspace = true

# CUDA is loaded at run time (dynamic loading of nvcuda / nvrtc), so the
# crate builds without a CUDA toolkit; elsewhere it is an empty backend.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12040"] }

[dev-dependencies]
mklight-trace.workspace = true
mklight-analysis.workspace = true
rustfft.workspace = true
rayon.workspace = true
serde_json.workspace = true
mklight-engine.workspace = true
mklight-bench = { path = "../mklight-bench" }

[[test]]
name = "tests"
path = "tests/main.rs"
