[package]
name = "mklight-webgpu"
description = "MKLight WebGPU compute backend (wgpu, WGSL kernels)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
# One test program for `tests/` (`tests/main.rs`), not one per file.
autotests = false
build = "build.rs"

[dependencies]
mklight-core.workspace = true
mklight-gpu.workspace = true
bytemuck.workspace = true
wgpu = "30"
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
mklight-trace.workspace = true

[[test]]
name = "tests"
path = "tests/main.rs"
