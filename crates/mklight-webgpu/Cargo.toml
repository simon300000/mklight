[package]
name = "mklight-webgpu"
description = "MKLight WebGPU compute backend (wgpu, WGSL kernels)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
# One test program for `tests/` (`tests/main.rs`), not one per file.
autotests = false
build = "build.rs"

[dependencies]
mklight-core.workspace = true
mklight-gpu.workspace = true
bytemuck.workspace = true
wgpu = "30"
pollster = "1"
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true

[dev-dependencies]
mklight-trace.workspace = true
rustfft.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
mklight-metal.workspace = true

[[test]]
name = "tests"
path = "tests/main.rs"
