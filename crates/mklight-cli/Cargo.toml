[package]
name = "mklight-cli"
description = "MKLight headless command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "mklight"
path = "src/main.rs"

[dependencies]
mklight-core.workspace = true
mklight-engine.workspace = true
mklight-trace.workspace = true
mklight-ffi = { path = "../mklight-ffi" }
serde.workspace = true
serde_json.workspace = true
clap = { version = "4.5", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
approx.workspace = true
