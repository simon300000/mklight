[package]
name = "mklight-engine"
description = "MKLight engine facade: sessions, projects, job scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# Solver crates whose analyses are registered (`analysis::register_all`)
# and the GPU backends the engine selects (`gpu`).
[dependencies]
mklight-core.workspace = true
mklight-trace.workspace = true
mklight-analysis.workspace = true
mklight-wave.workspace = true
mklight-ghost.workspace = true
mklight-stray.workspace = true
mklight-gpu.workspace = true
mklight-metal.workspace = true
mklight-optim.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
blake3.workspace = true
rayon.workspace = true
# Load average: the cost model's prior for host contention.
libc = "0.2"

[dev-dependencies]
# tests/aim_precision_study.rs includes mklight-gpu/tests/p1_support.rs.
bytemuck.workspace = true
