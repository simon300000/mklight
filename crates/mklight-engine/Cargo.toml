[package]
name = "mklight-engine"
description = "MKLight engine facade: sessions, projects, job scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The solver crates (mklight-trace, -analysis, -wave, -ghost, -stray, -optim,
# -gpu, -metal) are added back as dependencies when their analyses and
# backends are registered (see `analysis::builtin::PLANNED` and `backend`).
[dependencies]
mklight-core.workspace = true
# Optimisation and tolerancing jobs (`analysis::optim`), with GPU-batched
# merit evaluation on the `mklight-gpu` device the engine selects.
mklight-optim.workspace = true
mklight-gpu.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
blake3.workspace = true

[dev-dependencies]
approx.workspace = true
# The optimize job on the Metal device (skipped without one).
mklight-metal.workspace = true
