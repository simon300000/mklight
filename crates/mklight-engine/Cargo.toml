[package]
name = "mklight-engine"
description = "MKLight engine facade: sessions, projects, job scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Solver crates whose analyses are registered (`analysis::register_all`)
# and the GPU backends the engine selects (`gpu`). mklight-wave joins when
# its analyses are registered (see `analysis::builtin::PLANNED`).
[dependencies]
mklight-core.workspace = true
mklight-trace.workspace = true
mklight-analysis.workspace = true
mklight-ghost.workspace = true
mklight-stray.workspace = true
mklight-gpu.workspace = true
mklight-metal.workspace = true
mklight-optim.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
blake3.workspace = true
rayon.workspace = true

[dev-dependencies]
approx.workspace = true
# The optimize job on the Metal device (skipped without one).
mklight-metal.workspace = true
