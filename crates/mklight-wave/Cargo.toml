serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
rustfft.workspace = true
num-complex.workspace = true
png.workspace = true


[target.'cfg(target_os = "macos")'.dev-dependencies]
mklight-metal.workspace = true

[[test]]
name = "tests"
path = "tests/main.rs"
