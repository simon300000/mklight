[package]
name = "mklight-stray"
description = "MKLight non-sequential Monte-Carlo stray-light transport"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
mklight-gpu.workspace = true
mklight-core.workspace = true
mklight-trace.workspace = true
mklight-ghost.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
libc = "0.2"
blake3.workspace = true

[dev-dependencies]
approx.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
mklight-metal.workspace = true

# Actual-Metal P10 harnesses; the benchmarks are `#[ignore]`d.
[[test]]
name = "p10_metal_geometry"
path = "tests/p10_support/host.rs"

[[test]]
name = "p10_transport"
path = "tests/p10_support/transport.rs"

[[test]]
name = "p10_bench"
path = "tests/p10_support/bench.rs"

[[test]]
name = "p10_kernel_designs"
path = "tests/p10_support/kernel_designs.rs"

[[test]]
name = "p10_transport_bench"
path = "tests/p10_support/transport_bench.rs"
