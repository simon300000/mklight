[package]
name = "mklight-core"
description = "MKLight shared physical model, materials, coatings, snapshots and job framework"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
# One test program for `tests/` (`tests/main.rs`), not one per file.
autotests = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
blake3.workspace = true
num-complex.workspace = true
# The exact software fma (`platform::fma_exact`).
libm.workspace = true

# Platform plumbing (`platform`): host statistics natively, the browser
# clocks on wasm32.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time.workspace = true

[dev-dependencies]
approx.workspace = true

# `--cfg mklight_libm_fma`: the web build without `platform::fma_symbol`
# (scripts/build-wasm.sh --libm-fma, for measurements).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(mklight_libm_fma)"] }

[[test]]
name = "tests"
path = "tests/main.rs"
